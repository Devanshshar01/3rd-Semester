<text x="258" y="139" fill="#27372d" font-family="Georgia,serif" font-size="47" letter-spacing="-1.8">Your learning,</text><text x="258" y="188" fill="#71816e" font-family="Georgia,serif" font-size="47" letter-spacing="-1.8">on your terms.</text><text x="260" y="218" fill="#747a70" font-family="Arial,sans-serif" font-size="11">Pick up where you left off, or make a little room for something new.</text>
